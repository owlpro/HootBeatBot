services:
  bridge:
    build: .
    env_file: .env
    restart: unless-stopped
    init: true
    read_only: true
    volumes:
      - bridge-data:/data/state
      - ./config/topics.yml:/app/config/topics.yml:ro
    tmpfs:
      - /app/var/tmp:uid=10001,gid=10001,mode=0700,noexec,nosuid,size=512m
      - /tmp:uid=10001,gid=10001,mode=0700,noexec,nosuid,size=512m
    healthcheck:
      test: ["CMD", "music-bridge", "--check-config"]
      interval: 30s
      timeout: 10s
      retries: 3
    cap_drop:
      - ALL
    cap_add:
      - SYS_CHROOT
    security_opt:
      - apparmor=hootbeatbot-chromium
      - seccomp=./security/seccomp/chromium.json

    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bridge-data:
